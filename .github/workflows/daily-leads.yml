name: leadgen daily refresh

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC daily
  workflow_dispatch:
    inputs:
      since_days:
        description: "Look-back window for sources (days)"
        required: false
        default: "45"
      enrich_budget:
        description: "Max leads to enrich this run (0 = unlimited)"
        required: false
        default: "0"
      reenrich:
        description: "Force re-enrichment on every lead"
        type: boolean
        required: false
        default: false
      publish_only:
        description: "Skip fetch+enrich; just re-project the committed leads.db and publish (fast, no Gemini)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: leadgen
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Backstop only. The run self-limits via --time-budget-s (below) and always
    # commits its progress, so it should finish well under this and never be
    # killed mid-write.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: leadgen/pyproject.toml

      - name: Install leadgen
        working-directory: leadgen
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run leadgen
        working-directory: leadgen
        env:
          OPENAI_API_KEY:        ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          ADZUNA_APP_ID:         ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY:        ${{ secrets.ADZUNA_APP_KEY }}
          GEMINI_MIN_INTERVAL_S: "0"     # paid tier — no client-side pacing
          # Anomaly alerts (silent-source-failure guard). Unset -> no alert.
          NTFY_TOPIC:            ${{ secrets.NTFY_TOPIC }}
          # schedule runs leave inputs.* empty -> the defaults below apply.
          SINCE_DAYS:            ${{ inputs.since_days }}
          ENRICH_BUDGET:         ${{ inputs.enrich_budget }}
          REENRICH:              ${{ inputs.reenrich }}
          PUBLISH_ONLY:          ${{ inputs.publish_only }}
          # Concurrency for the Gemini/OpenAI enrichment lookups (paid tier).
          # Tune via a repo variable without editing this file; empty -> 12.
          ENRICH_WORKERS:        ${{ vars.ENRICH_WORKERS }}
        run: |
          # publish_only: reproject the already-committed leads.db and publish,
          # skipping the slow fetch + the Gemini enrichment (and its quota).
          if [[ "$PUBLISH_ONLY" == "true" ]]; then
            python -m leadgen.run --skip-fetch --skip-enrich
            exit 0
          fi
          # Enrichment lookups run --enrich-workers-wide in parallel (paid Gemini
          # tier), so a full nightly drain fits easily -> budget 0 (unlimited) so
          # the whole backlog refreshes every night. --time-budget-s stays a
          # backstop: it stops enrichment with time to score/emit/commit, and
          # progress is committed per lead, so a bad night still makes headway.
          args=(
            "--enrich-budget"  "${ENRICH_BUDGET:-0}"
            "--enrich-workers" "${ENRICH_WORKERS:-12}"
            "--time-budget-s"  "4500"
          )
          if [[ -n "$SINCE_DAYS" ]]; then
            args+=("--since-days" "$SINCE_DAYS")
          fi
          if [[ "$REENRICH" == "true" ]]; then
            args+=("--reenrich")
          fi
          python -m leadgen.run "${args[@]}"

      - name: Publish inventory to Vercel Blob
        # Only when the run finished and emitted fresh JSON. Uses the official
        # @vercel/blob SDK (token-only auth — the `vercel` CLI needs a separate
        # account login, the SDK does not) with a short cache so the outreach
        # engine reads same-day data. Public store -> outreach reads with NO token.
        if: success()
        working-directory: leadgen
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [[ -z "$BLOB_READ_WRITE_TOKEN" ]]; then
            echo "BLOB_READ_WRITE_TOKEN unset — skipping publish"; exit 0
          fi
          npm i @vercel/blob@latest --no-save >/dev/null 2>&1
          out="$(node scripts/publish_blob.mjs)"
          echo "$out"
          base="$(printf '%s\n' "$out" | sed -n 's/^OUTREACH base: //p')"
          if [[ -n "$base" ]]; then
            echo "::notice title=Inventory published::LEADGEN_BLOB_BASE_URL=$base"
          fi

      - name: Commit updated DB
        # `always()`, not `success()`: enrichment commits each lead to leads.db
        # as it goes, so even a partial/failed run made real progress worth
        # persisting (the backlog shrinks next run). Data-only, normal push.
        if: always()
        run: |
          git config user.name  "leadgen-cron[bot]"
          git config user.email "leadgen-cron[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain leadgen/data/leads.db)" ]]; then
            git pull --rebase --autostash origin main || true
            git add leadgen/data/leads.db
            git commit -m "leadgen cron: nightly lead refresh ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Alert on failure
        # The cron rotted silently for days once. Never again: ping on any
        # failed OR cancelled (timeout) run.
        if: failure() || cancelled()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [[ -n "$NTFY_TOPIC" ]]; then
            curl -s \
              -H "Title: leadgen cron failed" \
              -H "Priority: high" \
              -d "run ${{ github.run_id }} failed/cancelled — see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              "https://ntfy.sh/$NTFY_TOPIC" || true
          else
            echo "NTFY_TOPIC unset — no alert sent"
          fi
